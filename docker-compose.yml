services:
  wg-ros-fakeip:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/huexpub/ros-wg-fakeip:latest
    container_name: wg-ros-fakeip
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DNS_ADDR: ":53"
      FAKEIP_CIDR: "198.18.0.0/16"
      UPSTREAM_DNS: "1.1.1.1:53"
      TCP_REDIRECT_ENABLED: "false"
      WG_INTERFACE: wg0
      TCP_REDIRECT_PORT: "15001"
      TZ: Asia/Shanghai
    volumes:
      - /opt/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51820:51820/tcp"
      - "53:53/udp"
      - "53:53/tcp"
      - "127.0.0.1:8080:8080/tcp"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    healthcheck:
      test: ["CMD", "/usr/local/bin/wgcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
